name: Workflow for OpenSSF Scorecard
# This workflow reports the supply-chain security health of the repository.
# It runs on a schedule and on pushes to the default branch, and it never
# gates a pull request.
on:
  push:
    branches: [ master ]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload of the SARIF results to code scanning needs this permission.
      security-events: write
      # Publication of the results needs a GitHub OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publication makes the results available to the README badge.
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

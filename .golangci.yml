version: "2"
run:
  concurrency: 4
  build-tags:
    - mytag
  modules-download-mode: readonly
  issues-exit-code: 2
  tests: false
  allow-parallel-runners: true
  allow-serial-runners: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: false
      print-issued-lines: false
  sort-order:
    - linter
    - severity
    - file
  path-prefix: ""
linters:
  default: fast
  enable:
    - goconst
    - prealloc
    - predeclared
  disable:
    - depguard
  settings:
    prealloc:
      simple: true
      range-loops: false
      for-loops: true
  exclusions:
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - forbidigo
        path-except: _test\.go
      - linters:
          - gosec
        path: internal/hmac/
        text: weak cryptographic primitive
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - .*\.my\.go$
      - lib/bad.go
      - pb
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: HEAD
  whole-files: true
  new: true
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - alias
        - prefix(m4o.io/pbf)
        - localmodule
      custom-order: true
  exclusions:
    paths:
      - .*\.my\.go$
      - lib/bad.go
      - pb
